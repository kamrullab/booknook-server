name: Keep Render API Awake

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping BookNook API health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 120 https://booknook-server-xlsi.onrender.com/
